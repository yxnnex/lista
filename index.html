<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Lista de Chequeo</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding: 20px;
            color: #fff;
        }

        .container {
            width: 100%;
            max-width: 500px;
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.25);
            padding: 25px;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.3);
        }

        h1 {
            font-size: 1.8rem;
            margin-bottom: 15px;
            text-align: center;
            font-weight: 600;
        }

        .input-group {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        select, input[type="text"] {
            background: rgba(255, 255, 255, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.4);
            border-radius: 12px;
            padding: 12px 15px;
            color: #fff;
            outline: none;
            font-size: 0.95rem;
        }

        select {
            flex: 1;
            min-width: 130px;
            cursor: pointer;
        }

        select option {
            background: #4a4e69;
            color: #fff;
        }

        input[type="text"] {
            flex: 2;
            min-width: 180px;
        }

        input[type="text"]::placeholder {
            color: rgba(255, 255, 255, 0.7);
        }

        button.btn-add {
            width: 100%;
            background: rgba(255, 255, 255, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.5);
            color: #fff;
            padding: 12px;
            border-radius: 12px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.3s ease;
        }

        button.btn-add:hover {
            background: rgba(255, 255, 255, 0.45);
        }

        .category-section {
            margin-top: 20px;
        }

        .category-title {
            font-size: 1.1rem;
            margin-bottom: 10px;
            text-transform: uppercase;
            letter-spacing: 1px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.2);
            padding-bottom: 5px;
            color: #e0e1dd;
        }

        ul {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-bottom: 15px;
        }

        li {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 12px 15px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            transition: all 0.4s ease;
        }

        .item-content {
            display: flex;
            align-items: center;
            gap: 12px;
            cursor: pointer;
            flex-grow: 1;
        }

        .checkbox {
            width: 22px;
            height: 22px;
            border-radius: 6px;
            border: 2px solid rgba(255, 255, 255, 0.6);
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s ease;
        }

        .checkbox::after {
            content: '✓';
            font-weight: bold;
            display: none;
            color: #fff;
        }

        .item-text {
            font-size: 1rem;
            transition: all 0.3s ease;
        }

        /* Estado completado / tachado */
        li.completed {
            background: rgba(0, 0, 0, 0.2);
            border-color: rgba(255, 255, 255, 0.05);
            order: 99; /* Lo mueve automáticamente al final del contenedor flex */
        }

        li.completed .checkbox {
            background: #4ef037;
            border-color: #4ef037;
        }

        li.completed .checkbox::after {
            display: block;
        }

        li.completed .item-text {
            text-decoration: line-through;
            font-weight: bold;
            opacity: 0.6;
        }

        .delete-btn {
            background: transparent;
            border: none;
            color: rgba(255, 255, 255, 0.5);
            font-size: 1.1rem;
            cursor: pointer;
            padding: 0 5px;
        }

        .delete-btn:hover {
            color: #ff6b6b;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Mi Lista</h1>
        
        <div class="input-group">
            <select id="categorySelect">
                <option value="Supermercado">🛒 Super</option>
                <option value="Viajes">🧳 Viaje</option>
                <option value="Ropa">👕 Ropa</option>
                <option value="Varios">📌 Varios</option>
            </select>
            <input type="text" id="itemInput" placeholder="Agregar elemento..." onkeypress="if(event.key==='Enter') addItem()">
            <button class="btn-add" onclick="addItem()">Agregar</button>
        </div>

        <div id="listsContainer"></div>
    </div>

    <script>
        let items = JSON.parse(localStorage.getItem('myChecklist')) || [];

        function saveItems() {
            localStorage.setItem('myChecklist', JSON.stringify(items));
        }

        function addItem() {
            const textInput = document.getElementById('itemInput');
            const categorySelect = document.getElementById('categorySelect');
            
            const text = textInput.value.trim();
            const category = categorySelect.value;

            if (text === '') return;

            items.push({
                id: Date.now(),
                text: text,
                category: category,
                completed: false
            });

            textInput.value = '';
            saveItems();
            render();
        }

        function toggleItem(id) {
            items = items.map(item => {
                if (item.id === id) item.completed = !item.completed;
                return item;
            });
            saveItems();
            render();
        }

        function deleteItem(id) {
            items = items.filter(item => item.id !== id);
            saveItems();
            render();
        }

        function render() {
            const container = document.getElementById('listsContainer');
            container.innerHTML = '';

            const categories = [...new Set(items.map(i => i.category))];

            categories.forEach(cat => {
                const section = document.createElement('div');
                section.className = 'category-section';

                const title = document.createElement('div');
                title.className = 'category-title';
                title.textContent = cat;
                section.appendChild(title);

                const ul = document.createElement('ul');
                ul.style.display = 'flex';
                ul.style.flexDirection = 'column';

                const catItems = items.filter(i => i.category === cat);
                
                catItems.forEach(item => {
                    const li = document.createElement('li');
                    if (item.completed) li.classList.add('completed');

                    li.innerHTML = `
                        <div class="item-content" onclick="toggleItem(${item.id})">
                            <div class="checkbox"></div>
                            <span class="item-text">${item.text}</span>
                        </div>
                        <button class="delete-btn" onclick="deleteItem(${item.id})">✕</button>
                    `;
                    ul.appendChild(li);
                });

                section.appendChild(ul);
                container.appendChild(section);
            });
        }

        render();
    </script>
</body>
</html>
