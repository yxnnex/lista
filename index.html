<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Lista en la Nube</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            /* Fondo que se repite perfectamente en patrón */
            background-image: url('fondolista.png');
            background-repeat: repeat;
            background-size: 320px auto;
            background-position: top left;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding: 20px;
            color: #4a3b4e;
        }

        /* Tarjeta principal súper traslúcida y flotante */
        .container {
            width: 100%;
            max-width: 480px;
            background: rgba(255, 255, 255, 0.35);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            border-radius: 24px;
            border: 2px solid rgba(255, 255, 255, 0.6);
            padding: 25px;
            box-shadow: 
                0 20px 40px rgba(186, 115, 142, 0.2),
                0 8px 16px rgba(0, 0, 0, 0.05);
            margin-top: 10px;
            margin-bottom: 20px;
        }

        h1 {
            font-size: 1.8rem;
            margin-bottom: 20px;
            text-align: center;
            font-weight: 700;
            color: #7a4b63;
        }

        .input-group {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        select, input[type="text"] {
            background: rgba(255, 255, 255, 0.5);
            border: 1.5px solid rgba(230, 180, 200, 0.6);
            border-radius: 14px;
            padding: 12px 15px;
            color: #5a3e51;
            outline: none;
            font-size: 0.95rem;
        }

        select {
            flex: 1;
            min-width: 130px;
            cursor: pointer;
        }

        select option {
            background: #fff;
            color: #5a3e51;
        }

        input[type="text"] {
            flex: 2;
            min-width: 180px;
        }

        input[type="text"]::placeholder {
            color: #b592a5;
        }

        button.btn-add {
            width: 100%;
            background: #e88ab5;
            border: none;
            color: #fff;
            padding: 13px;
            border-radius: 14px;
            font-weight: bold;
            font-size: 1rem;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(232, 138, 181, 0.4);
            transition: all 0.2s ease;
        }

        button.btn-add:hover {
            background: #df7aa8;
            transform: translateY(-1px);
        }

        .category-section {
            margin-top: 20px;
        }

        .category-title {
            font-size: 1rem;
            margin-bottom: 10px;
            text-transform: uppercase;
            letter-spacing: 1.2px;
            border-bottom: 2px dashed rgba(220, 160, 185, 0.5);
            padding-bottom: 6px;
            color: #9c5c
