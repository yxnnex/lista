<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Lista en la Nube</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-image: url('fondolista.png');
            background-repeat: repeat;
            background-size: 320px auto;
            background-position: top left;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding: 20px;
            color: #4a3b4e;
        }

        .container {
            width: 100%;
            max-width: 480px;
            background: rgba(255, 255, 255, 0.45);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border-radius: 24px;
            border: 2px solid rgba(255, 255, 255, 0.7);
            padding: 25px;
            box-shadow: 
                0 20px 40px rgba(186, 115, 142, 0.25),
                0 8px 16px rgba(0, 0, 0, 0.08);
            margin-top: 10px;
            margin-bottom: 20px;
        }

        h1 {
            font-size: 1.8rem;
            margin-bottom: 20px;
            text-align: center;
            font-weight: 700;
            color: #7a4b63;
        }

        .input-group {
            display: flex;
            gap: 10px;
            margin-bottom: 12px;
            flex-wrap: wrap;
        }

        select, input[type="text"] {
            background: rgba(255, 255, 255, 0.65);
            border: 1.5px solid rgba(230, 180, 200, 0.7);
            border-radius: 14px;
            padding: 12px 15px;
            color: #5a3e51;
            outline: none;
            font-size: 0.95rem;
        }

        select {
            flex: 1;
            min-width: 130px;
            cursor: pointer;
        }

        select option {
            background: #fff;
            color: #5a3e51;
        }

        input[type="text"] {
            flex: 2;
            min-width: 180px;
        }

        input[type="text"]::placeholder {
            color: #b592a5;
        }

        .btn-actions {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        button.btn-add {
            flex: 2;
            background: #e88ab5;
            border: none;
            color: #fff;
            padding: 13px;
            border-radius: 14px;
            font-weight: bold;
            font-size: 1rem;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(232, 138, 181, 0.4);
            transition: all 0.2s ease;
        }

        button.btn-add:hover {
            background: #df7aa8;
            transform: translateY(-1px);
        }

        .btn-camera {
            flex: 1;
            background: rgba(255, 255, 255, 0.7);
            border: 1.5px solid rgba(230, 180, 200, 0.8);
            color: #7a4b63;
            padding: 13px;
            border-radius: 14px;
            font-weight: bold;
            font-size: 0.95rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            box-shadow: 0 4px 10px rgba(160, 100, 130, 0.08);
            transition: all 0.2s ease;
        }

        .btn-camera:hover {
            background: rgba(255, 255, 255, 0.9);
        }

        #ocrStatus {
            display: none;
            text-align: center;
            font-size: 0.88rem;
            color: #9c5c7d;
            margin-bottom: 15px;
            font-weight: 600;
        }

        .category-section {
            margin-top: 20px;
        }

        .category-title {
            font-size: 1rem;
            margin-bottom: 10px;
            text-transform: uppercase;
            letter-spacing: 1.2px;
            border-bottom: 2px dashed rgba(220, 160, 185, 0.5);
            padding-bottom: 6px;
            color: #9c5c7d;
            font-weight: 700;
        }

        ul {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-bottom: 15px;
        }

        li {
            background: rgba(255, 255, 255, 0.55);
            border: 1px solid rgba(255, 255, 255, 0.8);
            padding: 12px 15px;
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            box-shadow: 0 4px 10px rgba(160, 100, 130, 0.05);
            transition: all 0.3s ease;
        }

        .item-content {
            display: flex;
            align-items: center;
            gap: 12px;
            cursor: pointer;
            flex-grow: 1;
        }

        .checkbox {
            width: 22px;
            height: 22px;
            border-radius: 7px;
            border: 2px solid #d896b5;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s ease;
            background: #fff;
        }

        .checkbox::after {
            content: '✓';
            font-weight: bold;
            display: none;
            color: #fff;
            font-size: 0.9rem;
        }

        .item-text {
            font-size: 1rem;
            color: #4a3b4e;
            transition: all 0.3s ease;
        }

        li.completed {
            background: rgba(245, 235, 240, 0.45);
            border-color: transparent;
            box-shadow: none;
            order: 99;
        }

        li.completed .checkbox {
            background: #73c8a9;
            border-color: #73c8a9;
        }

        li.completed .checkbox::after {
            display: block;
        }

        li.completed .item-text {
            text-decoration: line-through;
            font-weight: bold;
            color: #997b8c;
            opacity: 0.7;
        }

        .delete-btn {
            background: transparent;
            border: none;
            color: #c98ba5;
            font-size: 1.1rem;
            cursor: pointer;
            padding: 0 5px;
        }

        .delete-btn:hover {
            color: #e65c5c;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Mi Lista 🛒</h1>
        
        <div class="input-group">
            <select id="categorySelect">
                <option value="Supermercado">🛒 Super</option>
                <option value="Viajes">🧳 Viaje</option>
                <option value="Ropa">👕 Ropa</option>
                <option value="Varios">📌 Varios</option>
            </select>
            <input type="text" id="itemInput" placeholder="Agregar elemento..." onkeypress="if(event.key==='Enter') window.addItem()">
        </div>

        <div class="btn-actions">
            <button class="btn-add" onclick="window.addItem()">Agregar</button>
            <button class="btn-camera" onclick="document.getElementById('cameraInput').click()">
                📷 Escanear
            </button>
        </div>

        <input type="file" id="cameraInput" accept="image/*" capture="environment" style="display: none;" onchange="window.scanListWithGemini(event)">

        <div id="ocrStatus">✨ Analizando la foto con IA...</div>

        <div id="listsContainer"></div>
    </div>

    <!-- Firebase y Lógica -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getDatabase, ref, push, onValue, update, remove } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCFgIK9iOHzeFIbIHTs2yhyczgkvM18mPA",
            authDomain: "milista-74731.firebaseapp.com",
            databaseURL: "https://milista-74731-default-rtdb.firebaseio.com",
            projectId: "milista-74731",
            storageBucket: "milista-74731.firebasestorage.app",
            messagingSenderId: "1074854652654",
            appId: "1:1074854652654:web:ed581010a236e8d2d3e1ff"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        const itemsRef = ref(db, 'items');

        let rawItems = {};

        onValue(itemsRef, (snapshot) => {
            rawItems = snapshot.val() || {};
            render();
        });

        window.addItem = function(customText = null) {
            const textInput = document.getElementById('itemInput');
            const categorySelect = document.getElementById('categorySelect');
            const text = customText || textInput.value.trim();
            const category = categorySelect.value;

            if (text === '') return;

            push(itemsRef, {
                text: text,
                category: category,
                completed: false
            });

            if (!customText) textInput.value = '';
        };

        function fileToBase64(file) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.readAsDataURL(file);
                reader.onload = () => resolve(reader.result.split(',')[1]);
                reader.onerror = error => reject(error);
            });
        }

        window.scanListWithGemini = async function(event) {
            const file = event.target.files[0];
            if (!file) return;

            // Pide la API Key si aún no se guardó en el navegador
            let apiKey = localStorage.getItem('GEMINI_KEY');
            if (!apiKey) {
                apiKey = prompt("Ingresa tu API Key de Gemini:");
                if (apiKey) {
                    apiKey = apiKey.trim();
                    localStorage.setItem('GEMINI_KEY', apiKey);
                } else {
                    event.target.value = '';
                    return;
                }
            }

            const status = document.getElementById('ocrStatus');
            status.style.display = 'block';
            status.textContent = '✨ Leyendo letra a mano con IA...';

            try {
                const base64Image = await fileToBase64(file);

                // Modelo actualizado a gemini-2.5-flash
                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${apiKey}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        contents: [{
                            parts: [
                                { text: "Transcripción de lista manuscrita: Lee todos los ítems de esta imagen. Devuelve ÚNICAMENTE los elementos en texto plano, uno por línea. No agregues numeración, guiones ni texto introductorio." },
                                {
                                    inline_data: {
                                        mime_type: file.type || "image/jpeg",
                                        data: base64Image
                                    }
                                }
                            ]
                        }]
                    })
                });

                const data = await response.json();
                
                if (data.error) {
                    // Si falla la clave, la remueve para poder volver a pedirla sin quedarse trabado
                    localStorage.removeItem('GEMINI_KEY');
                    throw new Error(data.error.message || "Error en la clave o petición");
                }

                const textResponse = data.candidates[0].content.parts[0].text;
                const lines = textResponse.split('\n');

                let count = 0;
                lines.forEach(line => {
                    const cleanLine = line.trim().replace(/^[-*•\d.\s]+/, '');
                    if (cleanLine.length > 0) {
                        window.addItem(cleanLine);
                        count++;
                    }
                });

                status.textContent = `✨ ¡Listo! Se agregaron ${count} elementos.`;
                setTimeout(() => { status.style.display = 'none'; }, 3000);
            } catch (error) {
                console.error(error);
                status.textContent = '❌ Error al procesar la foto.';
                setTimeout(() => { status.style.display = 'none'; }, 3000);
            }

            event.target.value = '';
        };

        window.toggleItem = function(id) {
            const currentStatus = rawItems[id].completed;
            update(ref(db, 'items/' + id), {
                completed: !currentStatus
            });
        };

        window.deleteItem = function(id) {
            remove(ref(db, 'items/' + id));
        };

        function render() {
            const container = document.getElementById('listsContainer');
            container.innerHTML = '';

            const itemList = Object.keys(rawItems).map(key => ({
                id: key,
                ...rawItems[key]
            }));

            const categories = [...new Set(itemList.map(i => i.category))];

            categories.forEach(cat => {
                const section = document.createElement('div');
                section.className = 'category-section';

                const title = document.createElement('div');
                title.className = 'category-title';
                title.textContent = cat;
                section.appendChild(title);

                const ul = document.createElement('ul');

                const catItems = itemList.filter(i => i.category === cat);
                
                catItems.forEach(item => {
                    const li = document.createElement('li');
                    if (item.completed) li.classList.add('completed');

                    li.innerHTML = `
                        <div class="item-content" onclick="window.toggleItem('${item.id}')">
                            <div class="checkbox"></div>
                            <span class="item-text">${item.text}</span>
                        </div>
                        <button class="delete-btn" onclick="window.deleteItem('${item.id}')">✕</button>
                    `;
                    ul.appendChild(li);
                });

                section.appendChild(ul);
                container.appendChild(section);
            });
        }
    </script>
</body>
</html>
